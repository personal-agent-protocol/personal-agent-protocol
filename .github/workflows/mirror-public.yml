# Pushes main to the public repository, personal-agent-protocol/personal-agent-protocol, after each
# change. The push isn't forced, so if the public main has commits that aren't here, the job fails
# instead of overwriting them.
#
# Only main is mirrored: a run on any other branch or tag, including a manual run, pushes nothing.
#
# Setup: install a GitHub App on the public repository with Contents and Workflows write access.
# In this repository, create the deployment environment public-mirror, with deployment branches
# limited to main, and save the app's ID as its variable MIRROR_APP_ID and its private key as its
# secret MIRROR_APP_PRIVATE_KEY. Don't save the key as a repository secret: a run on any branch
# can read those, including one that edits this file to remove the checks below.
name: Mirror to public repository

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: mirror-public
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    mirror:
        # The workflow is mirrored too; don't run it in the public repository.
        if: github.repository == 'sierra-inc/personal-agent-protocol' && github.ref == 'refs/heads/main'
        # The environment's branch policy gives the key only to runs on main.
        environment: public-mirror
        runs-on: ubuntu-latest
        steps:
            - uses: actions/create-github-app-token@v2
              id: app-token
              with:
                  app-id: ${{ vars.MIRROR_APP_ID }}
                  private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
                  owner: personal-agent-protocol
                  repositories: personal-agent-protocol

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # A run on main can be older than main, but never ahead of it.
            - name: Check the commit is on main
              run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

            - name: Push main
              env:
                  TOKEN: ${{ steps.app-token.outputs.token }}
              run: git push "https://x-access-token:${TOKEN}@github.com/personal-agent-protocol/personal-agent-protocol.git" "${GITHUB_SHA}:refs/heads/main"
