name: Spec feedback
description: A point about the specification or docs, or a longer review from an agent or the site's comments.
labels: ["feedback"]
body:
    - type: markdown
      attributes:
          value: |
              For a single point, fill in the page and kind. For a longer review, paste an [agent's review](https://personalagentprotocol.org/docs/path-to-1#feedback), or comments exported from the … menu next to Comments, and choose **Review (several points)**.
    - type: dropdown
      id: page
      attributes:
          label: Page
          options:
              - Introduction
              - Specification
              - Extensions
              - Operations extension
              - Guides
              - Path to 1.0
              - Company kit
              - Several pages
      validations:
          required: true
    - type: input
      id: section
      attributes:
          label: Section
          description: Optional. The section number or link, for example `4.3` or `https://personalagentprotocol.org/docs/spec#sending-tokens`.
    - type: dropdown
      id: kind
      attributes:
          label: Kind
          description: For a security vulnerability, don't open an issue. Report it privately, as [SECURITY.md](https://github.com/personal-agent-protocol/personal-agent-protocol/blob/main/SECURITY.md) describes. Design problems already discussed in the open are fine here.
          options:
              - Gap
              - Ambiguous
              - Contradiction
              - Risk (privacy or security)
              - Simplification
              - Wording
              - Question
              - Review (several points)
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: Feedback
          description: What's wrong and why it matters, with a suggested change if you have one. Quote the docs only when it makes the point clearer.
      validations:
          required: true
